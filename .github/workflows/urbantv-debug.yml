name: UrbanTV - APK de prueba

on:
  push:
    branches:
      - feature/urbantv-branding-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Compilar APK Android (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest ya incluye Android SDK y cmdline-tools; no instalar el paquete obsoleto "tools".
      - name: Preparar Android SDK 36
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: chmod +x gradlew && ./gradlew :app-mobile:assembleDebug --no-daemon --stacktrace
      - name: Adjuntar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UrbanTV-debug-apk
          path: app-mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
