name: UrbanTV - APK de prueba

on:
  push:
    branches:
      - feature/urbantv-branding-v1
      - security/urbantv-hardening-v1
      - security/urbantv-permissions-v2
      - fix/urbantv-onboarding-security-exception
      - feature/urbantv-open-cinema-v1
      - feature/urbantv-platforms-and-m3u-v1
      - feature/urbantv-premium-home-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Compilar APK Android (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest ya incluye Android SDK y cmdline-tools; no instalar el paquete obsoleto "tools".
      - name: Preparar Android SDK 36
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No se encontró sdkmanager en Android SDK"
            exit 1
          fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Evitar regresion de permiso de instalacion
        shell: bash
        run: |
          set -euo pipefail
          if grep -RnE 'canRequestPackageInstalls|isUnknownSourcesAllowed|createUnknownSourcesIntent|ACTION_MANAGE_UNKNOWN_APP_SOURCES' feature/mobile/onboarding/src/main; then
            echo "::error::El asistente contiene una llamada insegura al permiso de instalar APK"
            exit 1
          fi
          echo "OK: asistente sin APIs de instalacion externa."
      - name: Compilar
        run: chmod +x gradlew && ./gradlew :app-mobile:assembleDebug --no-daemon --stacktrace
      - name: Verificar que APK no solicite permisos sensibles
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=$(find app-mobile/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK_PATH"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK_PATH" | tee /tmp/urbantv-permissions.txt
          if grep -E 'android.permission.(REQUEST_INSTALL_PACKAGES|MANAGE_EXTERNAL_STORAGE|REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)' /tmp/urbantv-permissions.txt; then
            echo "::error::El APK contiene permisos restringidos"
            exit 1
          fi
      - name: Adjuntar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UrbanTV-premium-home-debug-apk
          path: app-mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
